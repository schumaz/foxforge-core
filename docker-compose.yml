version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: foxforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: foxforge_db
      POSTGRES_USER: foxforge_user
      POSTGRES_PASSWORD: FoxForge#SecurePass2026!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foxforge_user -d foxforge_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
